<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  </head>
  <body>
    <header>
      <h1><a href="{{ "" | relURL }}">{{ .Site.Title }}</a></h1>
      <nav><a href="{{ "posts/" | relURL }}">Posts</a></nav>
      <hr />
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
  </body>
</html>
